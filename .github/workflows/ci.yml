name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check syntax
        shell: bash
        run: |
          for f in src/main/main.js src/main/lib/*.js src/preload/preload.js src/renderer/*.js; do
            node --check "$f"
          done
      - name: Run unit tests
        run: npm test
